[Unit]
# Wants= not Requires=: iio-sensor-proxy is the GNOME desktop's sensor
# provider. If ADSP/fastrpc is not ready yet, the desktop must still start;
# hexagonrpcd-sensors.service will come up later and iio-sensor-proxy picks
# the SSC device up via udev when it appears.
Wants=hexagonrpcd-sensors.service
After=hexagonrpcd-sensors.service

[Service]
ExecStart=
ExecStart=/usr/libexec/iio-sensor-proxy
