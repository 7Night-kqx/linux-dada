# systemd drop-in: hand the display manager our A830-capable Mesa.
# Install to /etc/systemd/system/{gdm,gdm3}.service.d/50-mesa-a830.conf
# (or lightdm.service.d/ for LightDM).
[Service]
Environment="LD_LIBRARY_PATH=/opt/mesa-a830/runtime"
Environment="LIBGL_DRIVERS_PATH=/opt/mesa-a830/lib/aarch64-linux-gnu/dri"
Environment="GBM_BACKENDS_PATH=/opt/mesa-a830/lib/aarch64-linux-gnu/gbm"
Environment="__EGL_VENDOR_LIBRARY_FILENAMES=/opt/mesa-a830/share/glvnd/egl_vendor.d/50_mesa.json"
Environment="VK_DRIVER_FILES=/opt/mesa-a830/share/vulkan/icd.d/freedreno_icd.aarch64.json"
UnsetEnvironment=LIBGL_ALWAYS_SOFTWARE
